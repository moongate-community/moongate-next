name: Release

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install release dependencies
        run: npm ci

      - name: Restore .NET
        run: dotnet restore Moongate.slnx

      - name: Build .NET
        run: dotnet build Moongate.slnx --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test Moongate.slnx --configuration Release --no-build

      - name: Build UI
        run: npm ci && npm run build
        working-directory: ui

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: npm run release

      - name: Detect published release
        id: released
        run: |
          if [[ -f artifacts/released-tag.txt ]]; then
            tag="$(cat artifacts/released-tag.txt)"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore .NET tools
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        run: dotnet tool restore

      - name: Build release assemblies for docs
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        run: dotnet build Moongate.slnx --configuration Release --no-restore

      - name: Build DocFX site
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        run: dotnet tool run docfx docs/docfx/docfx.json

      - name: Configure GitHub Pages
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/docfx/_site

      - name: Deploy GitHub Pages
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        uses: actions/deploy-pages@v5
