name: Release

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      reason: ${{ steps.gate.outputs.reason }}

    steps:
      - name: Evaluate release gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual release requested" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=stable release branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.ref_name }}" != "develop" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=unsupported branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq 'map(.labels[].name) | .[]' 2>/dev/null || true
          )"

          if printf '%s\n' "$labels" | grep -Eq '^(publish-prerelease|publish-prelease)$'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=develop PR requested prerelease publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=false" >> "$GITHUB_OUTPUT"
          echo "reason=develop PR has no publish-prerelease label" >> "$GITHUB_OUTPUT"

  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs: release-gate
    if: needs.release-gate.outputs.should_release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install release dependencies
        run: npm ci

      - name: Restore .NET
        run: dotnet restore Moongate.slnx

      - name: Build .NET
        run: dotnet build Moongate.slnx --configuration Release --no-restore

      - name: Prepare default UO client directory
        run: mkdir -p ~/uo

      - name: Test .NET
        run: dotnet test Moongate.slnx --configuration Release --no-build

      - name: Build UI
        run: npm ci && npm run build
        working-directory: ui

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: npm run release

      - name: Detect published release
        id: released
        run: |
          if [[ -f artifacts/released-tag.txt ]]; then
            tag="$(cat artifacts/released-tag.txt)"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore .NET tools
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        run: dotnet tool restore

      - name: Build release assemblies for docs
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        run: dotnet build Moongate.slnx --configuration Release --no-restore

      - name: Build DocFX site
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        run: dotnet tool run docfx docs/docfx/docfx.json

      - name: Configure GitHub Pages
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/docfx/_site

      - name: Deploy GitHub Pages
        if: steps.released.outputs.published == 'true' && github.ref_name == 'main'
        uses: actions/deploy-pages@v5
